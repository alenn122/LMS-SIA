<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Homepage</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
    }

    /* MAIN CONTENT */
    .content-container {
      margin-top: 120px;   /* below fixed header */
      flex:auto;
      margin-left: 220px;  /* default sidebar width */
      transition: margin-left 0.3s ease;
      padding: 20px;
    }

    /* When sidebar is collapsed */
    body.sidebar-collapsed .content-container {
      margin-left: 60px;
    }

    /* Limit content width & center */
    .content-container .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Dashboard header box */
    .main-header {
      background-color: #e9eef6;
      text-align: center;
      padding: 30px;
      font-weight: bold;
      margin-bottom: 15px;
      border-radius: 8px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="d-flex justify-content-between align-items-center p-3 fixed-top">
    <div class="logo">
      <img src="img/loa_logo.png" alt="" width="70%" class="px-4">
    </div>
    <div class="text-center lh-1">
      <li class="cdsp">COLEGIO de SAN PEDRO</li>
      <li>UNDER THE NEW MANAGEMENT OF</li>
      <li class="loa">Lyceum of Alabang</li>
      <li class="iso">ISO 9001:2015 Certified</li>
    </div>
    <div class="logo">
      <img src="img/cdsp_logo.png" alt="" width="40%">
    </div>
  </header>

  <!-- SIDEBAR (loaded here) -->
  <div id="sidebar-container"></div>

  <!-- MAIN CONTENT -->
  <div class="content-container">
    <div class="main-header mb-5">DASHBOARD</div>

    <div class="container">
      <p>👋 Welcome, Librarian!</p>
      <small class="text-muted">Here’s what’s happening in the library today:</small>
      <!-- your dashboard cards here -->
    </div>
  </div>

  <!-- Load Sidebar -->
  <script>
    fetch("sidebar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("sidebar-container").innerHTML = data;

        const sidebar = document.querySelector(".sidebar");
        const toggleBtn = document.querySelector(".menu-toggle");

        toggleBtn.addEventListener("click", () => {
          sidebar.classList.toggle("collapsed");
          document.body.classList.toggle("sidebar-collapsed"); // 🔑 toggle class on body
        });

        // Highlight active link
        const links = document.querySelectorAll(".nav-links a");
        links.forEach(link => {
          if (window.location.href.includes(link.getAttribute("href"))) {
            link.classList.add("active");
          }
        });
      });
  </script>
</body>
</html>
